spring:
  application:
    name: bizu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bizu}
    username: ${DB_USER:bizu}
    # Sem senha padrão de propósito: vazia, a conexão é recusada. Em dev use o perfil "dev"
    # (application-dev.yml, que casa com o compose.yaml); em produção defina DB_PASSWORD.
    password: ${DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

bizu:
  # Segredo que a Evolution envia no header "apikey" do webhook. Vazio = webhook recusa tudo.
  webhook-segredo: ${WEBHOOK_SEGREDO:}
  conversa:
    limite-respostas: 20
    reinicio-apos: 7d
    janela-agrupamento: 4s
    sondagem-fila: 1s
    maximo-tentativas: 3
  painel:
    # Login do painel: ID token do Google, só para o e-mail do corretor, e sessão em JWT do próprio Bizu.
    # Tudo vem de variáveis de ambiente; o segredo precisa ter ao menos 32 caracteres.
    google-client-id: ${GOOGLE_CLIENT_ID:}
    email-corretor: ${BIZU_EMAIL_CORRETOR:}
    jwt-segredo: ${BIZU_JWT_SEGREDO:}
    jwt-validade: 8h
    origem-permitida: ${BIZU_PAINEL_ORIGEM:http://localhost:3000}
  agente:
    # inativo = não responde ninguém (conversa fica com o corretor); claude = usa a API da Anthropic.
    # A chave vem só da variável de ambiente ANTHROPIC_API_KEY, nunca deste arquivo.
    tipo: ${BIZU_AGENTE:inativo}
    modelo: claude-haiku-5-5
    max-tokens: 4096
  evolution:
    base-url: ${EVOLUTION_URL:http://localhost:8081}
    instancia: ${EVOLUTION_INSTANCIA:bizu}
    api-key: ${EVOLUTION_API_KEY:}
