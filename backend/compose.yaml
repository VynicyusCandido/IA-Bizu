# Postgres apenas para desenvolvimento local. Credenciais de teste, não usar em produção.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: corretor
      POSTGRES_USER: corretor
      POSTGRES_PASSWORD: corretor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
