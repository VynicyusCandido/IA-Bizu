name: Testes

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/test.yml"]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify roda os testes unitários (surefire) e depois os *IT contra Postgres real (failsafe).
      # O Docker já vem no runner; o Testcontainers sobe o Postgres sozinho.
      - name: Testes unitários e de integração
        run: mvn -B -ntp verify

      - name: Relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7
